[package]
name = "crit"
version = "0.1.0"
edition = "2021"
description = "A tree-sitter-based, language-agnostic source security scanner with first-class InterSystems ObjectScript support."
license = "MIT"
repository = "https://github.com/twbrowning/crit"
readme = "README.md"
keywords = ["tree-sitter", "security", "sast", "objectscript", "scanner"]
categories = ["command-line-utilities", "development-tools"]
default-run = "crit"

[features]
# The bundled ObjectScript grammars are compiled in by default. Turn this off
# (`--no-default-features`) for a tiny binary that only loads grammars
# dynamically from compiled shared libraries.
default = ["bundled-objectscript"]
bundled-objectscript = []

[dependencies]
tree-sitter = "0.25"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
libloading = "0.8"
regex = "1"
walkdir = "2"
anyhow = "1"
thiserror = "2"
owo-colors = { version = "4", features = ["supports-colors"] }
sha2 = "0.11.0"

[build-dependencies]
cc = "1"

# The vendored ObjectScript parsers are very large generated C files. Compiling
# them at -O0 keeps build time and memory reasonable; parser performance is
# dominated by the table-driven runtime, not optimization level. build.rs forces
# opt-level 0 on those translation units regardless of this profile.
[profile.dev]
opt-level = 0

[profile.release]
opt-level = 2
