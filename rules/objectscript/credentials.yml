# Hardcoded-credential rules.
rules:
  # `set pwd = "literal"` where the target name looks like a secret.
  # Raw `query:` form: the full target/value paths are spelled out because
  # tree-sitter children are direct (no descendant combinator).
  - id: os-hardcoded-credential-set
    name: Hardcoded credential assigned to a variable
    message: >-
      A string literal is assigned to a variable whose name suggests a secret;
      do not embed credentials in source.
    severity: error
    languages: [objectscript]
    cwe: CWE-798
    query: |
      ((set_argument
         (set_target (glvn (lvn (objectscript_identifier) @name)))
         (expression (expr_atom (string_literal)))) @match
       (#match? @name "(?i)^(password|passwd|pwd|secret|apikey|api_key|token|credential)"))

  # `Parameter SECRETKEY = "literal";` in a class definition (UDL).
  # STRUCTURED `pattern:` form that the engine transpiles to a query.
  - id: os-hardcoded-credential-parameter
    name: Hardcoded credential in a class Parameter
    message: >-
      A class Parameter with a secret-like name has a hardcoded string default;
      store secrets outside source (e.g. a credentials vault).
    severity: error
    languages: [objectscript_udl]
    cwe: CWE-798
    pattern:
      node: parameter
      children:
        - node: parameter_name
          children:
            - node: identifier
              text:
                regex: "(?i)(password|passwd|pwd|secret|secretkey|apikey|api_key|token|credential)"
        - node: default_argument_value
          children:
            - node: typename
              text:
                regex: "^\""
