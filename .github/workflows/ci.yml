name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Test (grammar consumption + rule matching)
        run: cargo test --verbose
      - name: Self-scan example fixtures
        run: cargo run -- scan tests/fixtures/vulnerable --rules rules --format sarif --fail-on off
