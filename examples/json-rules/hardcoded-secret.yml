# Example rule for a dynamically-loaded language (JSON), demonstrating that
# catseye is language-agnostic: the same engine and rule formats work for any
# tree-sitter grammar.
#
#   catseye --languages-config examples/languages.toml \
#           scan config.json --rules examples/json-rules/
id: json-hardcoded-secret
name: Hardcoded secret in JSON
message: A JSON key that looks like a secret has a string-literal value.
severity: error
languages: [json]
cwe: CWE-798
query: |
  ((pair
     key: (string (string_content) @key)
     value: (string)) @match
   (#match? @key "(?i)(password|passwd|secret|token|apikey|api_key|credential)"))
